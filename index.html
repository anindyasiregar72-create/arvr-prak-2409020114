        .judul {

            right: 0;
            z-index: 10;

            color: #17365d;
            pointer-events: none;

    <a-scene background="color: #B9E7FF">

        <a-text value="Anindya Fadhilah Fauzi Siregar" position="-2.7 3 -4" align="center" color="#17365D" width="6">
